<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caption Wallah Ai</title>
</head>

<link rel="stylesheet" href="style.css">

<body>


<div class="mainheader">
        <h1>Caption Wallah AI</h1>
        <div class="logo">
            <img src="images\cwai2logo1.jpg" alt="Logo">
        </div>
    </div>

    <section>
  <div class="window">

      <div class="mainheading">
    Upload an image to generate the perfect caption for your next post.
  </div>
  
    <div class="h2">Select Vibe</div>

    <div class="container">
      <div class="folder">
        <div class="front-side">
          <div class="tip"></div>
          <div class="cover"></div>
        </div>
        <div class="back-side cover"></div>
      </div>

      <label class="custom-file-upload">
        <input id="imageUpload" class="title" type="file" accept="image/*" />
        Upload a File
      </label>
    </div>

    <div class="vive">
      <div class="glass-radio-group">
        <input type="radio" name="plan" id="glass-silver" checked="" />
        <label for="glass-silver">Simple</label>

        <input type="radio" name="plan" id="glass-gold" />
        <label for="glass-gold">Bold</label>

        <input type="radio" name="plan" id="glass-platinum" />
        <label for="glass-platinum">Professional</label>

        <div class="glass-glider"></div>
      </div>
    </div>

    <button id="generateBtn" class="generate-btn" type="button">Generate Captions</button>

    <!-- <div class="prompt-box">
    <div class="text-box">
      <p id="promptText">Upload an image to generate the perfect caption for your next post.</p>
    </div>
    </div>

    <div id="captionGrid" class="caption-grid" aria-live="polite"></div> -->

   
<div class="func">
    <div class="action-row">
      <button class="action-btn share" type="button">
        <span class="icon">➤</span>
        <span>Share</span>
      </button>

      <button class="action-btn copy" type="button">
        <span class="icon">🗐</span>
        <span>Copy</span>
      </button>

      <button class="action-btn regen" type="button">
        <span class="icon">✦</span>
        <span>Regenrate</span>
      </button>
    </div>
</div>

  </div>
</section>

    <script src="script.js"></script>
</body>
</html>
